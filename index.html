<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ChatGPT Clone</title>
    <link rel="stylesheet" href="css/main.css" />
  </head>
  <body>
    <div class="app_layout">
      <aside class="sidebar">
        <nav class="sidebar_nav">
          <div class="logo">
            <span class="brand_name">ChatGPT</span>
            <span class="brand_plan">Go</span>
          </div>
          <div class="nav_icons">
            <button class="icon_btn tooltip_trigger" id="searchTriggerBtn">
              <img src="./assets/icons/magnifying-glass.svg" alt="Search" />
              <span class="tooltip_box tooltip_box--right"
                >Search chats <span class="shortcut">Ctrl + K</span></span
              >
            </button>
            <button class="icon_btn tooltip_trigger">
              <img src="./assets/icons/panel-left.svg" alt="Sidebar" />
              <span class="tooltip_box tooltip_box--right">Close sidebar</span>
            </button>
          </div>
        </nav>

        <div class="sidebar_content">
          <div class="sidebar_utils">
            <ul class="utils_list">
              <li class="utils_item active">
                <img
                  class="utils_icon"
                  src="./assets/icons/square-pen.svg"
                  alt="New chat"
                />
                <a href="#" class="utils_link">New chat</a>
              </li>
              <li class="utils_item">
                <img
                  class="utils_icon"
                  src="./assets/icons/library-big.svg"
                  alt="Library"
                />
                <a href="#" class="utils_link">Library</a>
              </li>
              <li class="utils_item">
                <img
                  class="utils_icon"
                  src="./assets/icons/folder-closed.svg"
                  alt="Projects"
                />
                <a href="#" class="utils_link">Projects</a>
              </li>
              <li class="utils_item">
                <img
                  class="utils_icon"
                  src="./assets/icons/clock-7.svg"
                  alt="Scheduled"
                />
                <a href="#" class="utils_link">Scheduled</a>
              </li>
              <li class="utils_item">
                <img
                  class="utils_icon"
                  src="./assets/icons/house-plug.svg"
                  alt="Plugins"
                />
                <a href="#" class="utils_link">Plugins</a>
              </li>
              <li class="utils_item">
                <img
                  class="utils_icon"
                  src="./assets/icons/codex.svg"
                  alt="Codex"
                />
                <a href="#" class="utils_link">Codex</a>
              </li>
              <li class="utils_item">
                <img
                  class="utils_icon"
                  src="./assets/icons/dots-horizontal.svg"
                  alt="More"
                />
                <a href="#" class="utils_link">More</a>
              </li>
            </ul>
          </div>

          <div class="recents">
            <div class="history_group">
              <div class="group_header">
                <button class="group_toggle_btn">
                  Pinned
                  <img
                    class="chevron_icon"
                    src="./assets/icons/chevron-down.svg"
                    alt="chevron-down"
                  />
                </button>
              </div>
              <ul class="group_list">
                <li class="group_item">
                  <img
                    class="history_icon"
                    src="./assets/icons/chat-bubble.svg"
                    alt=""
                  />
                  <a href="#" class="group_link">Hub Issues Summary</a>

                  <!-- Hover Actions (Appears on hover) -->
                  <div class="chat_hover_actions">
                    <button class="icon_btn tooltip_trigger">
                      <img src="./assets/icons/unpin.svg" alt="Unpin" />
                      <span class="tooltip_box">Unpin chat</span>
                    </button>
                    <div class="popover_wrapper">
                      <button class="icon_btn js-toggle-chat-options">
                        <img src="./assets/icons/dots.svg" alt="Options" />
                      </button>

                      <!-- Chat Options Popover -->
                      <div
                        class="dropdown_menu dropdown_menu--right chat_options_menu"
                      >
                        <button class="menu_item">
                          <img src="./assets/icons/share.svg" alt="Share" />
                          Share
                        </button>
                        <button class="menu_item">
                          <img src="./assets/icons/edit.svg" alt="Rename" />
                          Rename
                        </button>
                        <button class="menu_item">
                          <img src="./assets/icons/unpin.svg" alt="Unpin" />
                          Unpin chat
                        </button>
                        <button class="menu_item">
                          <img src="./assets/icons/archive.svg" alt="Archive" />
                          Archive
                        </button>
                        <button class="menu_item text_danger">
                          <img src="./assets/icons/delete.svg" alt="Delete" />
                          Delete
                        </button>
                        <div class="menu_divider"></div>
                        <button class="menu_item flex_between">
                          <span
                            ><img src="./assets/icons/folder.svg" alt="Move" />
                            Move to project</span
                          >
                          <img
                            src="./assets/icons/chevron-right.svg"
                            alt="arrow"
                          />
                        </button>
                      </div>
                    </div>
                  </div>
                </li>
              </ul>
            </div>

            <div class="history_group">
              <div class="history_header">
                <button class="dropdown_btn">
                  Recents
                  <img src="./assets/icons/chevron-down.svg" alt="arrow" />
                </button>
                <div class="header_actions">
                  <button class="icon_btn">
                    <img src="./assets/icons/square-pen.svg" alt="New chat" />
                  </button>
                  <div class="popover_wrapper">
                    <button class="icon_btn js-toggle-organize">
                      <img
                        src="./assets/icons/dots-horizontal.svg"
                        alt="More"
                      />
                    </button>
                    <div
                      class="dropdown_menu dropdown_menu--right organize_popover"
                    >
                      <div class="popover_title">Organize chats</div>
                      <button class="popover_item active">
                        <div class="item_left">
                          <img src="./assets/icons/list" alt="list" /> In one
                          list
                        </div>
                        <img
                          class="check_icon"
                          src="./assets/icons/check"
                          alt="check"
                        />
                      </button>
                      <button class="popover_item">
                        <div class="item_left">
                          <img src="./assets/icons/folder.svg" alt="folder" />
                          By project
                        </div>
                      </button>
                    </div>
                  </div>
                </div>
              </div>
              <ul class="group_list">
                <li class="group_item">
                  <a href="#" class="group_link">Best Companies And Perks</a>
                </li>
                <li class="group_item">
                  <a href="#" class="group_link"
                    >Explain Composer Prompt Suggesti...</a
                  >
                </li>
              </ul>
            </div>
          </div>
        </div>

        <div class="sidebar_footer">
          <div class="popover_wrapper w_100">
            <button class="profile_btn js-toggle-profile">
              <div class="avatar avatar--pink">RK</div>
              <div class="profile_info">
                <span class="profile_name">Rohan Kumar</span>
                <span class="plan_name">Go</span>
              </div>
              <img
                class="store_icon"
                src="./assets/icons/store.svg"
                alt="Store"
              />
            </button>

            <!-- Main Profile Popover -->
            <div class="dropdown_menu profile_menu dropdown_menu--up">
              <!-- Nested Account Popover -->
              <div class="popover_wrapper w_100 nested_trigger">
                <button class="menu_item profile_summary js-toggle-nested">
                  <div class="avatar avatar--pink">U1</div>
                  <div class="profile_info">
                    <span class="profile_name">u10111</span>
                    <span class="plan_name">Go</span>
                  </div>
                  <img src="./assets/icons/chevron-right.svg" alt="arrow" />
                </button>

                <div class="dropdown_menu dropdown_menu--right nested_menu">
                  <div class="menu_text">mcstar6262@gmail.com</div>
                  <button class="menu_item flex_between">
                    <span
                      ><div class="avatar avatar--pink small">U1</div>
                      u10111</span
                    >
                    <img src="./assets/icons/check.svg" alt="Active" />
                  </button>
                  <div class="menu_divider"></div>
                  <button class="menu_item">
                    <img src="./assets/icons/plus.svg" alt="Add" /> Add account
                  </button>
                </div>
              </div>

              <button class="menu_item">
                <img src="./assets/icons/star.svg" alt="Upgrade" /> Upgrade plan
              </button>
              <button class="menu_item">
                <img src="./assets/icons/settings.svg" alt="Personalization" />
                Personalization
              </button>
              <button class="menu_item">
                <img src="./assets/icons/user.svg" alt="Profile" /> Profile
              </button>
              <button class="menu_item">
                <img src="./assets/icons/settings.svg" alt="Settings" />
                Settings
              </button>
              <div class="menu_divider"></div>

              <!-- Nested Help Popover -->
              <div class="popover_wrapper w_100 nested_trigger">
                <button class="menu_item flex_between js-toggle-nested">
                  <span
                    ><img src="./assets/icons/help.svg" alt="Help" /> Help</span
                  >
                  <img src="./assets/icons/chevron-right.svg" alt="arrow" />
                </button>

                <div class="dropdown_menu dropdown_menu--right nested_menu">
                  <button class="menu_item">
                    <img src="./assets/icons/help.svg" alt="Center" /> Help
                    center
                  </button>
                  <button class="menu_item">
                    <img src="./assets/icons/edit.svg" alt="Release" /> Release
                    notes
                  </button>
                  <button class="menu_item">
                    <img src="./assets/icons/download.svg" alt="Apps" />
                    Download apps
                  </button>
                  <div class="menu_divider"></div>
                  <button class="menu_item">
                    <img src="./assets/icons/bug.svg" alt="Bug" /> Report a bug
                  </button>
                </div>
              </div>

              <div class="menu_divider"></div>
              <button class="menu_item">
                <img src="./assets/icons/logout.svg" alt="Logout" /> Log out
              </button>
            </div>
          </div>
        </div>
      </aside>

      <main class="main_view">
        <header class="main_header">
          <div class="popover_wrapper">
            <button class="model_selector_btn" id="modelSelectorBtn">
              ChatGPT
              <img
                class="action_icon"
                src="./assets/icons/chevron-down.svg"
                alt="chevron"
              />
            </button>
            <!-- Model Popover -->
            <div class="dropdown_menu" id="modelDropdown">
              <button class="menu_item active">GPT-4o</button>
              <button class="menu_item">GPT-4</button>
              <button class="menu_item">GPT-3.5</button>
            </div>
          </div>

          <button class="icon_btn refresh_btn">
            <img
              src="./assets/icons/message-circle-dashed.svg"
              alt="Temporary chat"
            />
          </button>
        </header>

        <div class="chat_container">
          <!-- STATE 1: ACTIVE CHAT FEED (Hidden by default) -->
          <div class="chat_feed hidden" id="chatFeed">
            <!-- Messages will be injected here by JS -->
          </div>

          <!-- STATE 2: INITIAL GREETING -->
          <h1 class="chat_greeting" id="chatGreeting">
            What’s on the agenda today?
          </h1>

          <!-- THE COMPOSER -->
          <div class="composer_wrapper popover_wrapper">
            <button class="btn_add tooltip_trigger js-toggle-attachment">
              <img src="./assets/icons/plus.svg" alt="Add" />
              <span class="tooltip_box">Attach files</span>
            </button>

            <!-- Attachment Dropdown Menu -->
            <div class="dropdown_menu attachment_menu" id="attachmentMenu">
              <button class="menu_item">
                <img src="./assets/icons/paperclip.svg" alt="" />
                <span class="item_text">
                  <span class="title">Add photos & files</span>
                  <span class="desc">Upload from computer</span>
                </span>
              </button>
              <button class="menu_item">
                <img src="./assets/icons/drive.svg" alt="" />
                <span class="item_text">
                  <span class="title">Add from library</span>
                  <span class="desc">Browse and search your files</span>
                </span>
              </button>
            </div>

            <input
              class="composer_input"
              id="chatInput"
              type="text"
              placeholder="Ask anything"
            />

            <div class="composer_actions">
              <button class="action_btn tooltip_trigger">
                <img
                  class="action_icon"
                  src="./assets/icons/brain.svg"
                  alt="Think"
                />
                Think
                <span class="tooltip_box">Get a smarter answer</span>
              </button>
              <button class="action_btn tooltip_trigger">
                <img
                  class="action_icon"
                  src="./assets/icons/mic.svg"
                  alt="Mic"
                />
                <span class="tooltip_box"
                  >Dictate <span class="shortcut">Ctrl + Shift + D</span></span
                >
              </button>
              <button class="action_btn btn_voice tooltip_trigger" id="sendBtn">
                <img
                  class="action_icon"
                  src="./assets/icons/audio-lines.svg"
                  alt="Voice"
                />
                <span class="tooltip_box">Start Voice</span>
              </button>
            </div>
          </div>

          <!-- INITIAL SUGGESTIONS -->
          <div class="suggestions" id="chatSuggestions">
            <button class="suggestion_btn">
              <div class="suggestion_content">
                <img src="./assets/icons/image.svg" alt="image" /> Create an
                image
              </div>
              <img
                class="close_icon"
                src="./assets/icons/cross-2.svg"
                alt="Close"
              />
            </button>
            <button class="suggestion_btn">
              <div class="suggestion_content">
                <img src="./assets/icons/pencil.svg" alt="write" /> Write or
                edit
              </div>
              <img
                class="close_icon"
                src="./assets/icons/cross-2.svg"
                alt="Close"
              />
            </button>
            <button class="suggestion_btn">
              <div class="suggestion_content">
                <img src="./assets/icons/globe.svg" alt="globe" /> Search the
                web
              </div>
              <img
                class="close_icon"
                src="./assets/icons/cross-2.svg"
                alt="Close"
              />
            </button>
          </div>
        </div>
      </main>
    </div>

    <!-- Search Modal -->
    <div class="modal_overlay" id="searchModal">
      <div class="search_modal">
        <div class="search_header">
          <input
            type="text"
            placeholder="Search chats..."
            class="search_modal_input"
          />
          <button class="icon_btn close_modal_btn" id="closeSearchModalBtn">
            <img src="./assets/icons/close.svg" alt="Close" />
          </button>
        </div>
        <div class="search_body">
          <button class="new_chat_row">
            <img src="./assets/icons/edit.svg" alt="" /> New chat
          </button>
          <div class="search_group">
            <h3 class="group_title">Today</h3>
            <button class="chat_row">
              <img src="./assets/icons/chat-bubble.svg" alt="" /> QuizRush App
              Creation
            </button>
            <button class="chat_row">
              <img src="./assets/icons/chat-bubble.svg" alt="" /> Gemini Access
              Sharing
            </button>
          </div>
          <div class="search_group">
            <h3 class="group_title">Yesterday</h3>
            <button class="chat_row">
              <img src="./assets/icons/chat-bubble.svg" alt="" /> Healthy
              Protein Bowls
            </button>
          </div>
        </div>
      </div>
    </div>

    <script src="js/data/_data.js" defer></script>
    <script src="js/Components/_chat.js" defer></script>
    <script src="js/main.js" defer></script>
  </body>
</html>
